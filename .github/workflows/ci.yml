name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  worker-startup-diagnostic:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Isolate worker startup (no credentials or model calls)
        run: |
          PYTHONPATH=src python - <<'PY'
          import os, subprocess, sys
          from nanorsi.process import safe_environment
          code = '''import faulthandler
          faulthandler.dump_traceback_later(2, repeat=True)
          print("interpreter ready", flush=True)
          import http.server, socketserver
          print("imports ready", flush=True)
          cls = http.server.HTTPServer if __import__("sys").argv[1] == "http" else socketserver.TCPServer
          with cls(("127.0.0.1", 0), http.server.BaseHTTPRequestHandler):
              print("bind ready", flush=True)
          '''
          for env_name, env in [("full", dict(os.environ)), ("safe", safe_environment())]:
              for session in [False, True]:
                  for protocol in ["http", "tcp"]:
                      print(env_name, session, protocol, flush=True)
                      try:
                          p = subprocess.run([sys.executable, "-u", "-c", code, protocol], env=env,
                                             start_new_session=session, capture_output=True, text=True, timeout=5)
                          print(p.returncode, p.stdout, p.stderr, flush=True)
                      except subprocess.TimeoutExpired as error:
                          print("TIMEOUT", error.stdout, error.stderr, flush=True)
          PY
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Tests
        run: python -m unittest discover -v
      - name: CLI smoke
        run: |
          nanorsi new artifact-fixture ./artifact-demo
          nanorsi baseline --workspace ./artifact-demo
          nanorsi step --workspace ./artifact-demo
          nanorsi verify --workspace ./artifact-demo
          nanorsi report --workspace ./artifact-demo --format html
          nanorsi new skills ./skills-contract
          test -f ./skills-contract/tasks/manifest.json
          test -f ./skills-contract/adapters/model.py
          nanorsi new coding ./coding-contract
          test -f ./coding-contract/evaluator/_skills.py
          test -f ./coding-contract/adapters/python_tests.py
          nanorsi configure --workspace ./coding-contract --model offline-ci --base-url http://127.0.0.1:8000/v1 --no-api-key --max-steps 1
          nanorsi doctor --workspace ./coding-contract
          python examples/coding_tasks/prepare.py --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build and install wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --no-deps dist/*.whl
      - name: Installed coding template
        run: |
          .wheel-venv/bin/nanorsi new coding ./coding-wheel
          test -f ./coding-wheel/evaluator/_skills.py
          test -f ./coding-wheel/adapters/python_tests.py
          .wheel-venv/bin/nanorsi configure --workspace ./coding-wheel --model offline-ci --base-url http://127.0.0.1:8000/v1 --no-api-key --max-steps 1
          .wheel-venv/bin/nanorsi doctor --workspace ./coding-wheel
          .wheel-venv/bin/python -c 'import importlib.metadata; assert not importlib.metadata.requires("nanorsi")'
      - name: Installed parameter-learning lifecycle
        run: |
          .wheel-venv/bin/nanorsi new model ./model-wheel
          .wheel-venv/bin/nanorsi baseline --workspace ./model-wheel
          .wheel-venv/bin/nanorsi run --workspace ./model-wheel
          .wheel-venv/bin/nanorsi freeze --workspace ./model-wheel --repeats 1
          .wheel-venv/bin/nanorsi final-test --workspace ./model-wheel
          .wheel-venv/bin/nanorsi report --workspace ./model-wheel --format html
          .wheel-venv/bin/nanorsi verify --workspace ./model-wheel
      - name: Installed live templates (offline)
        run: |
          for template in artifact harness; do
            .wheel-venv/bin/nanorsi new "$template" "./$template-wheel"
            .wheel-venv/bin/nanorsi configure --workspace "./$template-wheel" --model offline-ci --base-url http://127.0.0.1:8000/v1 --no-api-key --max-steps 1
            .wheel-venv/bin/nanorsi doctor --workspace "./$template-wheel"
          done
