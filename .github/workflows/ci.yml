name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Tests
        run: python -m unittest discover -v
      - name: CLI smoke
        run: |
          nanorsi new artifact ./artifact-demo
          nanorsi baseline --workspace ./artifact-demo
          nanorsi step --workspace ./artifact-demo
          nanorsi verify --workspace ./artifact-demo
          nanorsi new skills ./skills-contract
          test -f ./skills-contract/tasks/manifest.json
          test -f ./skills-contract/adapters/model.py
