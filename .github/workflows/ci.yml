name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Tests
        run: python -m unittest discover -v
      - name: CLI smoke
        run: |
          nanorsi new artifact ./artifact-demo
          nanorsi baseline --workspace ./artifact-demo
          nanorsi step --workspace ./artifact-demo
          nanorsi verify --workspace ./artifact-demo
          nanorsi report --workspace ./artifact-demo --format html
          nanorsi new skills ./skills-contract
          test -f ./skills-contract/tasks/manifest.json
          test -f ./skills-contract/adapters/model.py
          nanorsi new coding ./coding-contract
          test -f ./coding-contract/evaluator/_skills.py
          test -f ./coding-contract/adapters/python_tests.py
          nanorsi configure --workspace ./coding-contract --model offline-ci --base-url http://127.0.0.1:8000/v1 --no-api-key --max-steps 1
          nanorsi doctor --workspace ./coding-contract
          python examples/coding_tasks/prepare.py --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build and install wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --no-deps dist/*.whl
      - name: Installed coding template
        run: |
          .wheel-venv/bin/nanorsi new coding ./coding-wheel
          test -f ./coding-wheel/evaluator/_skills.py
          test -f ./coding-wheel/adapters/python_tests.py
          .wheel-venv/bin/nanorsi configure --workspace ./coding-wheel --model offline-ci --base-url http://127.0.0.1:8000/v1 --no-api-key --max-steps 1
          .wheel-venv/bin/nanorsi doctor --workspace ./coding-wheel
          .wheel-venv/bin/python -c 'import importlib.metadata; assert not importlib.metadata.requires("nanorsi")'
