name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Tests
        run: python -m unittest discover -v
      - name: CLI smoke (offline)
        run: |
          nanorsi new ./lab --goal "ci smoke"
          echo ci-offline-key > ./ci.key
          nanorsi configure --workspace ./lab --model offline-ci --base-url http://127.0.0.1:8000/v1 --api-key-file ./ci.key
          nanorsi doctor --workspace ./lab
          nanorsi verify --workspace ./lab
          nanorsi report --workspace ./lab
          test -f ./lab/reports/report.md

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Research notes consistency
        run: |
          python docs/research/industry-rsi/render.py --check
          python docs/research/industry-rsi/migrate_to_notes.py --check
      - name: Build and install wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --no-deps dist/*.whl
      - name: Installed template and zero runtime dependencies
        run: |
          .wheel-venv/bin/nanorsi new ./wheel-lab
          test -f ./wheel-lab/harness/systemprompt.md
          test -f ./wheel-lab/tasks/manifest.json
          test -f ./wheel-lab/judge/judge.py
          echo ci-offline-key > ./ci.key
          .wheel-venv/bin/nanorsi configure --workspace ./wheel-lab --model offline-ci --base-url http://127.0.0.1:8000/v1 --api-key-file ./ci.key
          .wheel-venv/bin/nanorsi doctor --workspace ./wheel-lab
          .wheel-venv/bin/python -c 'import importlib.metadata; assert not importlib.metadata.requires("nanorsi")'
