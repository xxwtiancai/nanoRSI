<text x="70" y="78" fill="#9ef01a" font-size="18px" font-weight="700" letter-spacing="2">NANORSI · 企业 RSI 证据</text>
<rect x="70" y="98" width="300" height="34" rx="17" fill="#9ef01a" opacity=".18"/><text x="88" y="121" fill="#9ef01a" font-size="16px" font-weight="700">参数与训练数据</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">直接有界闭环 · 2026-03-11</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">A3: An Automated Alignment Agent for</tspan><tspan x="70" dy="39.44">Safety Finetuning</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">Anthropic · Anthropic Fellows Program ·</tspan><tspan x="70" dy="20.8">Constellation</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">作者报告结果</text>
<text x="675" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">证据边界</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">在 Qwen-2.5-7B Instruct 上，外部迎合性评测从 68.0% 降至 42.0%，MMLU-Pro 从</tspan><tspan x="70" dy="22.95">52.9% 变为 52.4%（报告表 1）；迎合性越低越好。</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">仅覆盖三类目标失败；Llama 实验收益较弱并暴露遗忘问题。日志说明包含 OOD 反馈，不能把所有 OOD</tspan><tspan x="675" dy="22.95">划分都等同于完全未参与选择的最终测试。</tspan></text>
<text x="675" y="530" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">开放材料 / 许可</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">Apache-2.0 代码、配置与数据目录公开；需模型/API 和 GPU 软件栈。未核实训练后检查点及完整数据是否齐备。</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">来源：https://alignment.anthropic.com/2026/automated-alignment-agent/ · nanoRSI 本地复现：未运行</text>
