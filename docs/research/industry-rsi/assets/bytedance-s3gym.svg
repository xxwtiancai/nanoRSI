<circle cx="1085" cy="100" r="56" fill="#c4b5fd" opacity=".13"/><circle cx="1085" cy="100" r="25" fill="#c4b5fd" opacity=".35"/>
<text x="70" y="78" fill="#c4b5fd" font-size="18px" font-weight="700" letter-spacing="2">NANORSI · INDUSTRY RSI EVIDENCE</text>
<rect x="70" y="98" width="300" height="34" rx="17" fill="#c4b5fd" opacity=".18"/><text x="88" y="121" fill="#c4b5fd" font-size="16px" font-weight="700">Memory and context</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">Direct bounded loop · 2026-08-31</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">S3Gym: Can LLMs Turn Self-Testing and</tspan><tspan x="70" dy="39.44">Self-Judging into Self-Improvement?</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">ByteDance Seed · M-A-P · TokenWave.AI</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#c4b5fd" font-size="14px" font-weight="700" letter-spacing="1.4">AUTHOR-REPORTED RESULT</text>
<text x="675" y="365" fill="#c4b5fd" font-size="14px" font-weight="700" letter-spacing="1.4">EVIDENCE LIMIT</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">Across seven games, blockwise self-judgment quality has</tspan><tspan x="70" dy="22.95">near-zero correlation with next strict-evaluation improvement:</tspan><tspan x="70" dy="22.95">−0.010 for event agreement and −0.018 for negative calibration</tspan><tspan x="70" dy="22.95">error. These are correlations, not percentage gains. Context…</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">Game-specific bounded evaluation; recognizing success does not</tspan><tspan x="675" dy="22.95">ensure useful memory or transferable policies.</tspan></text>
<text x="675" y="530" fill="#c4b5fd" font-size="14px" font-weight="700" letter-spacing="1.4">OPEN MATERIALS / LICENSE</text>
