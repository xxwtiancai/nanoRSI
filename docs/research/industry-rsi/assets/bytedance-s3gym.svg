<title id="title">S3Gym: Can LLMs Turn Self-Testing and Self-Judging into Self-Improvement?</title>
<desc id="desc">Industry RSI evidence card for ByteDance Seed / M-A-P / TokenWave.AI, 2026-08-31.</desc>
