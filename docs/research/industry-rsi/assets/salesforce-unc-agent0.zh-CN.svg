<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Agent0: Unleashing Self-Evolving Agents from Zero Data via Tool-Integrated Reasoning</title>
<desc id="desc">Industry RSI evidence card for UNC-Chapel Hill / Salesforce Research / Stanford University, 2025-11-20.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#16213b"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="619" rx="22" fill="none" stroke="#2b3a58"/>
<circle cx="1085" cy="100" r="56" fill="#9ef01a" opacity=".13"/><circle cx="1085" cy="100" r="25" fill="#9ef01a" opacity=".35"/>
<text x="70" y="78" fill="#9ef01a" font-size="18px" font-weight="700" letter-spacing="2">NANORSI · 企业 RSI 证据</text>
<rect x="70" y="98" width="300" height="34" rx="17" fill="#9ef01a" opacity=".18"/><text x="88" y="121" fill="#9ef01a" font-size="16px" font-weight="700">参数与训练数据</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">直接有界闭环 · 2025-11-20</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">Agent0: Unleashing Self-Evolving</tspan><tspan x="70" dy="39.44">Agents from Zero Data via</tspan><tspan x="70" dy="39.44">Tool-Integrated Reasoning</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">UNC-Chapel Hill · Salesforce Research · Stanford</tspan><tspan x="70" dy="20.8">University</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">作者报告结果</text>
<text x="675" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">证据边界</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">Qwen3-8B 数学平均分从 49.2 升至 58.2（增加 9.0 个百分点，约相对提高 18%），仅加工具为</tspan><tspan x="70" dy="22.95">53.2。七个数学基准除 AMC/AIME 使用 mean@32 外均为贪心 pass@1；表 1 报告训练过程峰值。</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">零数据指不使用人工整理的训练集，并不代表没有预训练知识；自一致性可能强化错误，结果不证明无界改进。</tspan></text>
<text x="675" y="530" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">开放材料 / 许可</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">已确认官方课程及执行器训练代码，Apache-2.0 许可；未确认训练后权重及完整生成数据集的发布。</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">来源：https://arxiv.org/abs/2511.16043 · nanoRSI 本地复现：未运行</text>
</svg>
