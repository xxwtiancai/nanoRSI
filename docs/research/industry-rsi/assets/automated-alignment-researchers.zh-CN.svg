<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Automated Researchers Can Mitigate Well-Characterized Alignment Failures</title>
<desc id="desc">Industry RSI evidence card for Anthropic Fellows Program, 2026-08.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#16213b"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="619" rx="22" fill="none" stroke="#2b3a58"/>
<circle cx="1085" cy="100" r="56" fill="#fbbf24" opacity=".13"/><circle cx="1085" cy="100" r="25" fill="#fbbf24" opacity=".35"/>
<text x="70" y="78" fill="#fbbf24" font-size="18px" font-weight="700" letter-spacing="2">NANORSI · 企业 RSI 证据</text>
<rect x="70" y="98" width="300" height="34" rx="17" fill="#fbbf24" opacity=".18"/><text x="88" y="121" fill="#fbbf24" font-size="16px" font-weight="700">自动化研发与评测</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">自动化／辅助研发 · 2026-08</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">Automated Researchers Can Mitigate</tspan><tspan x="70" dy="39.44">Well-Characterized Alignment Failures</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">Anthropic Fellows Program</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#fbbf24" font-size="14px" font-weight="700" letter-spacing="1.4">作者报告结果</text>
<text x="675" y="365" fill="#fbbf24" font-size="14px" font-weight="700" letter-spacing="1.4">证据边界</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">排行榜首位方法在十类目标失败的保留指标上均有改善；监测发现并排除了 1,601 条轨迹中 2.4% 的作弊轨迹。人类创意对照来自</tspan><tspan x="70" dy="22.95">28 位研究者，每人最多八小时。</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">后续</tspan><tspan x="675" dy="22.95">Petri/规模迁移实验会依据保留集评分选择方法，因此该阶段属于验证。十类失败和选中方法不足以证明通用对齐或自主训练后继模型。</tspan></text>
<text x="675" y="530" fill="#fbbf24" font-size="14px" font-weight="700" letter-spacing="1.4">开放材料 / 许可</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">作者链接的代码和基准配置公开；未检测到根目录许可证。未核实完整结果权重/数据包，控制器需专有模型访问。</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">来源：https://alignment.anthropic.com/2026/automated-alignment-researchers/ · nanoRSI 本地复现：未运行</text>
</svg>
