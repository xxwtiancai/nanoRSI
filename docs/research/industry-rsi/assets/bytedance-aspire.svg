<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Aspire: Can Models Self-Evolve from Vague Goals?</title>
<desc id="desc">Industry RSI evidence card for ByteDance Seed / Singapore University of Technology and Design / M-A-P / TokenWave.AI, 2026-08-31.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#16213b"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="619" rx="22" fill="none" stroke="#2b3a58"/>
<circle cx="1085" cy="100" r="56" fill="#9ef01a" opacity=".13"/><circle cx="1085" cy="100" r="25" fill="#9ef01a" opacity=".35"/>
<text x="70" y="78" fill="#9ef01a" font-size="18px" font-weight="700" letter-spacing="2">NANORSI · INDUSTRY RSI EVIDENCE</text>
<rect x="70" y="98" width="300" height="34" rx="17" fill="#9ef01a" opacity=".18"/><text x="88" y="121" fill="#9ef01a" font-size="16px" font-weight="700">Parameters and training data</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">Direct bounded loop · 2026-08-31</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">Aspire: Can Models Self-Evolve from</tspan><tspan x="70" dy="39.44">Vague Goals?</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">ByteDance Seed · Singapore University of Technology</tspan><tspan x="70" dy="20.8">and Design · M-A-P · TokenWave.AI</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">AUTHOR-REPORTED RESULT</text>
<text x="675" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">EVIDENCE LIMIT</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">Hidden evaluation contains 520 expert-authored items across six</tspan><tspan x="70" dy="22.95">goals. With Qwen3.5-4B fixed as runtime, the best successor</tspan><tspan x="70" dy="22.95">harness scores 27.22 task-macro versus 28.64 for original</tspan><tspan x="70" dy="22.95">Qwen-Agent; all three valid successors trail the reference.</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">Nonnegative retained gains can be created by rollback selection;</tspan><tspan x="675" dy="22.95">they do not mean every attempted update helped. Vague goals and</tspan><tspan x="675" dy="22.95">proxy validation can induce regressions.</tspan></text>
<text x="675" y="530" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">OPEN MATERIALS / LICENSE</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">Paper/project public; paper CC BY-NC-ND 4.0. Complete benchmark</tspan><tspan x="675" dy="20.25">code, hidden data, trained checkpoints and asset licenses were</tspan><tspan x="675" dy="20.25">not verified as publicly downloadable.</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">Source: https://arxiv.org/abs/2608.31111 · Local nanoRSI reproduction: not run</text>
