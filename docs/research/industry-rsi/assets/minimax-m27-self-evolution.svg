<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">MiniMax reports over 100 autonomous scaffold iterations and a</tspan><tspan x="70" dy="22.95">30% improvement on internal programming evaluations. Absolute</tspan><tspan x="70" dy="22.95">baseline, evaluation-set identity and uncertainty are</tspan><tspan x="70" dy="22.95">undisclosed, so the number is not independently comparable.</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">First-party internal experiment, not a reproduced result.</tspan><tspan x="675" dy="22.95">Assisted model R&amp;D and scaffold self-editing do not establish</tspan><tspan x="675" dy="22.95">fully autonomous successor-model training.</tspan></text>
