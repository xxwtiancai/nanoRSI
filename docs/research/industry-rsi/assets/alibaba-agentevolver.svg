<circle cx="1085" cy="100" r="56" fill="#9ef01a" opacity=".13"/><circle cx="1085" cy="100" r="25" fill="#9ef01a" opacity=".35"/>
<text x="70" y="78" fill="#9ef01a" font-size="18px" font-weight="700" letter-spacing="2">NANORSI · INDUSTRY RSI EVIDENCE</text>
<rect x="70" y="98" width="300" height="34" rx="17" fill="#9ef01a" opacity=".18"/><text x="88" y="121" fill="#9ef01a" font-size="16px" font-weight="700">Parameters and training data</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">Direct bounded loop · 2025-11-13</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">AgentEvolver: Towards Efficient</tspan><tspan x="70" dy="39.44">Self-Evolving Agent System</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">Alibaba Group — Tongyi Lab</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">AUTHOR-REPORTED RESULT</text>
<text x="675" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">EVIDENCE LIMIT</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">Author Table 1: Qwen2.5-7B average avg@8 across AppWorld and</tspan><tspan x="70" dy="22.95">BFCL-v3 rises from 15.8% to 45.2%, a 29.4 percentage-point</tspan><tspan x="70" dy="22.95">difference. This compares the base model with the full trained</tspan><tspan x="70" dy="22.95">system, not an isolated credit-assignment ablation.</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">Task/judge quality and environment coverage bound the loop.</tspan><tspan x="675" dy="22.95">Evidence concerns agent training, not unlimited autonomous</tspan><tspan x="675" dy="22.95">redesign or general RSI.</tspan></text>
<text x="675" y="530" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">OPEN MATERIALS / LICENSE</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">Code: public ModelScope repository, Apache-2.0. Weights: no</tspan><tspan x="675" dy="20.25">standalone paper checkpoint verified. Data:</tspan><tspan x="675" dy="20.25">generation/integration code visible; complete training corpus…</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">Source: https://arxiv.org/abs/2511.10395 · Local nanoRSI reproduction: not run</text>
