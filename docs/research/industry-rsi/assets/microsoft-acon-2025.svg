<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="619" rx="22" fill="none" stroke="#2b3a58"/>
<circle cx="1085" cy="100" r="56" fill="#c4b5fd" opacity=".13"/><circle cx="1085" cy="100" r="25" fill="#c4b5fd" opacity=".35"/>
<text x="70" y="78" fill="#c4b5fd" font-size="18px" font-weight="700" letter-spacing="2">NANORSI · INDUSTRY RSI EVIDENCE</text>
<rect x="70" y="98" width="300" height="34" rx="17" fill="#c4b5fd" opacity=".18"/><text x="88" y="121" fill="#c4b5fd" font-size="16px" font-weight="700">Memory and context</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">Direct bounded loop · 2025-10-01</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">ACON: Optimizing Context Compression</tspan><tspan x="70" dy="39.44">for Long-horizon LLM Agents</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">Microsoft · KAIST · University of Cambridge</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#c4b5fd" font-size="14px" font-weight="700" letter-spacing="1.4">AUTHOR-REPORTED RESULT</text>
<text x="675" y="365" fill="#c4b5fd" font-size="14px" font-weight="700" letter-spacing="1.4">EVIDENCE LIMIT</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">OfficeBench with GPT-4.1 agent/compressor: utility-optimized</tspan><tspan x="70" dy="22.95">history compression achieves 74.74% accuracy and 4.93k peak</tspan><tspan x="70" dy="22.95">tokens, versus 76.84%/7.27k without compression and 71.58%/4.40k</tspan><tspan x="70" dy="22.95">with simple prompting (v1 Table 2).</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">Finite offline module optimization; the accuracy/token tradeoff</tspan><tspan x="675" dy="22.95">is not universal accuracy improvement or a self-rewriting</tspan><tspan x="675" dy="22.95">optimizer.</tspan></text>
<text x="675" y="530" fill="#c4b5fd" font-size="14px" font-weight="700" letter-spacing="1.4">OPEN MATERIALS / LICENSE</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">Official code and MIT licence verified, including distillation</tspan><tspan x="675" dy="20.25">pipelines. Released distilled weights, dedicated datasets and</tspan><tspan x="675" dy="20.25">their licences were not verified; external benchmarks/models…</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">Source: https://arxiv.org/abs/2510.00615 · Local nanoRSI reproduction: not run</text>
