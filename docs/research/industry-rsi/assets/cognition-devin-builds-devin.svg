<text x="70" y="365" fill="#fbbf24" font-size="14px" font-weight="700" letter-spacing="1.4">AUTHOR-REPORTED RESULT</text>
<text x="675" y="365" fill="#fbbf24" font-size="14px" font-weight="700" letter-spacing="1.4">EVIDENCE LIMIT</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">The company reports 659 Devin PRs merged into its codebase in</tspan><tspan x="70" dy="22.95">the preceding week, versus 154 in its best week of 2025. This</tspan><tspan x="70" dy="22.95">measures internal PR throughput, with no controlled capability,</tspan><tspan x="70" dy="22.95">quality or causal self-improvement evaluation.</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">Human task selection and merge decisions remain. Improving an AI</tspan><tspan x="675" dy="22.95">product&#x27;s software does not establish autonomous successor-model</tspan><tspan x="675" dy="22.95">training.</tspan></text>
<text x="675" y="530" fill="#fbbf24" font-size="14px" font-weight="700" letter-spacing="1.4">OPEN MATERIALS / LICENSE</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">Commercial service described; internal source patches, model</tspan><tspan x="675" dy="20.25">weights, PR-level data and research-artifact licenses are not</tspan><tspan x="675" dy="20.25">released in the opened reports.</tspan></text>
