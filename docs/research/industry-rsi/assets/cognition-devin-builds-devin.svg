<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">How Cognition Uses Devin to Build</tspan><tspan x="70" dy="39.44">Devin</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">Cognition</tspan></text>
