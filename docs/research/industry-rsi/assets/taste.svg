<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">TASTE: Can AI Models Judge AI Safety</tspan><tspan x="70" dy="39.44">Research Proposals?</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">Anthropic · Anthropic Fellows Program</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#fbbf24" font-size="14px" font-weight="700" letter-spacing="1.4">AUTHOR-REPORTED RESULT</text>
<text x="675" y="365" fill="#fbbf24" font-size="14px" font-weight="700" letter-spacing="1.4">EVIDENCE LIMIT</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">On 92 selected proposal pairs, reported best-model agreement is</tspan><tspan x="70" dy="22.95">60% versus estimated human agreement of 77%; model intervals</tspan><tspan x="70" dy="22.95">span roughly ±10 percentage points.</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">Small, filtered preference set; agreement is not realized</tspan><tspan x="675" dy="22.95">research impact. Human agreement is estimated using a specific</tspan><tspan x="675" dy="22.95">labeling protocol.</tspan></text>
<text x="675" y="530" fill="#fbbf24" font-size="14px" font-weight="700" letter-spacing="1.4">OPEN MATERIALS / LICENSE</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">Paper public; dataset access via an application form. Open code</tspan><tspan x="675" dy="20.25">license and unrestricted dataset release not verified; model</tspan><tspan x="675" dy="20.25">weights are not an output of this work.</tspan></text>
