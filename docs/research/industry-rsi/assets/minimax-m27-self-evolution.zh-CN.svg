<circle cx="1085" cy="100" r="56" fill="#6ee7f9" opacity=".13"/><circle cx="1085" cy="100" r="25" fill="#6ee7f9" opacity=".35"/>
<text x="70" y="78" fill="#6ee7f9" font-size="18px" font-weight="700" letter-spacing="2">NANORSI · 企业 RSI 证据</text>
<rect x="70" y="98" width="300" height="34" rx="17" fill="#6ee7f9" opacity=".18"/><text x="88" y="121" fill="#6ee7f9" font-size="16px" font-weight="700">Agent 与代码</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">直接有界闭环 · 2026-03-18</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">MiniMax M2.7: Early Echoes of</tspan><tspan x="70" dy="39.44">Self-Evolution</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">MiniMax</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#6ee7f9" font-size="14px" font-weight="700" letter-spacing="1.4">作者报告结果</text>
<text x="675" y="365" fill="#6ee7f9" font-size="14px" font-weight="700" letter-spacing="1.4">证据边界</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">MiniMax 报告进行了超过 100 轮自主 scaffold 迭代，内部编程评测提升</tspan><tspan x="70" dy="22.95">30%；未披露绝对基线、评测集身份及不确定性，因此不能独立横向比较。</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">这是第一方内部实验，尚非复现结果；辅助模型研发与 scaffold 自改不证明完全自主的后继模型训练。</tspan></text>
<text x="675" y="530" fill="#6ee7f9" font-size="14px" font-weight="700" letter-spacing="1.4">开放材料 / 许可</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">M2.7 权重公开。当前模型 LICENSE</tspan><tspan x="675" dy="20.25">为自定义非商业许可，商业使用需书面授权；未核验到内部自进化框架、评测数据及完整训练流程公开。</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">来源：https://www.minimax.io/news/minimax-m27-en · nanoRSI 本地复现：未运行</text>
