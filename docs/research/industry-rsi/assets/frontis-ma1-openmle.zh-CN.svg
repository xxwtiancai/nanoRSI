<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Frontis-MA1: Training an AI4AI Model towards Recursive Self-Improvement in Machine Learning Engineering</title>
<desc id="desc">Industry RSI evidence card for Frontis.AI — Horizon Research / Tsinghua University, 2026-07-30.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#16213b"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="619" rx="22" fill="none" stroke="#2b3a58"/>
<circle cx="1085" cy="100" r="56" fill="#fbbf24" opacity=".13"/><circle cx="1085" cy="100" r="25" fill="#fbbf24" opacity=".35"/>
<text x="70" y="78" fill="#fbbf24" font-size="18px" font-weight="700" letter-spacing="2">NANORSI · 企业 RSI 证据</text>
<rect x="70" y="98" width="300" height="34" rx="17" fill="#fbbf24" opacity=".18"/><text x="88" y="121" fill="#fbbf24" font-size="16px" font-weight="700">自动化研发与评测</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">直接有界闭环 · 2026-07-30</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">Frontis-MA1: Training an AI4AI Model</tspan><tspan x="70" dy="39.44">towards Recursive Self-Improvement in</tspan><tspan x="70" dy="39.44">Machine Learning Engineering</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">Frontis.AI — Horizon Research · Tsinghua University</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#fbbf24" font-size="14px" font-weight="700" letter-spacing="1.4">作者报告结果</text>
<text x="675" y="365" fill="#fbbf24" font-size="14px" font-weight="700" letter-spacing="1.4">证据边界</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">作者报告：固定 OpenMLE-Evo，将基础 35B 模型换为 Frontis-MA1 后，MLE-Bench Lite</tspan><tspan x="70" dy="22.95">平均获牌率从 39.39% 升至 60.61%；每任务 12 小时、单张 RTX 4090、显存上限 12 GB。Evo-Max</tspan><tspan x="70" dy="22.95">达到 71.21%，但同时改变搜索系统。</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">属于受限 MLE 领域的元进化；没有证明通用 RSI。模型与框架的联合成绩不能证明连续自主产生多代后继模型。</tspan></text>
<text x="675" y="530" fill="#fbbf24" font-size="14px" font-weight="700" letter-spacing="1.4">开放材料 / 许可</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">代码、35B/30B 权重、任务及 SFT 轨迹公开。原创代码与模型材料为 CC BY-NC</tspan><tspan x="675" dy="20.25">4.0；任务集包含不同上游条款，部分配方需另取上游数据。论文为 CC BY 4.0。</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">来源：https://arxiv.org/abs/2607.28568 · nanoRSI 本地复现：未运行</text>
</svg>
