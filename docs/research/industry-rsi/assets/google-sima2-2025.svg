<rect x="28" y="28" width="1144" height="619" rx="22" fill="none" stroke="#2b3a58"/>
<circle cx="1085" cy="100" r="56" fill="#9ef01a" opacity=".13"/><circle cx="1085" cy="100" r="25" fill="#9ef01a" opacity=".35"/>
<text x="70" y="78" fill="#9ef01a" font-size="18px" font-weight="700" letter-spacing="2">NANORSI · INDUSTRY RSI EVIDENCE</text>
<rect x="70" y="98" width="300" height="34" rx="17" fill="#9ef01a" opacity=".18"/><text x="88" y="121" fill="#9ef01a" font-size="16px" font-weight="700">Parameters and training data</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">Direct bounded loop · 2025-11-13</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">SIMA 2: A Generalist Embodied Agent</tspan><tspan x="70" dy="39.44">for Virtual Worlds</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">Google DeepMind</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">AUTHOR-REPORTED RESULT</text>
<text x="675" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">EVIDENCE LIMIT</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">On fixed ASKA tasks, fewer than one quarter initially exceeded</tspan><tspan x="70" dy="22.95">the Gemini reward threshold (&gt;50); later generations exceeded it</tspan><tspan x="70" dy="22.95">on every task. This measures model-scored task coverage, not</tspan><tspan x="70" dy="22.95">independently verified episode success. These fixed tasks were…</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">Bounded game experiments, model-based evaluation and short</tspan><tspan x="675" dy="22.95">memory; no demonstrated improvement of Gemini or the learning</tspan><tspan x="675" dy="22.95">algorithm itself.</tspan></text>
<text x="675" y="530" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">OPEN MATERIALS / LICENSE</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">Paper/demos verified. Training code, weights, experience data</tspan><tspan x="675" dy="20.25">and their licences were not identified in opened official</tspan><tspan x="675" dy="20.25">sources; proprietary Gemini remains required.</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">Source: https://deepmind.google/blog/sima-2-an-agent-that-plays-reasons-and-learns-with-you-in-virtual-3d-worlds/ · Local nanoRSI reproduction: not run</text>
</svg>
