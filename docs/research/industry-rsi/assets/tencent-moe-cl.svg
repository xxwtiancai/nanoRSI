<text x="675" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">EVIDENCE LIMIT</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">The paper evaluates sequential learning and Tencent</tspan><tspan x="70" dy="22.95">content-review applications. No numerical claim is retained</tspan><tspan x="70" dy="22.95">here: its abstract describes review-cost reduction while the</tspan><tspan x="70" dy="22.95">experimental discussion describes offline stripping-rate…</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">Preserving knowledge under externally supplied task streams is</tspan><tspan x="675" dy="22.95">not evidence of autonomous recursive self-improvement.</tspan><tspan x="675" dy="22.95">Industrial data access limits reproducibility.</tspan></text>
<text x="675" y="530" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">OPEN MATERIALS / LICENSE</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">Public BAI-LAB/MoE-CL implementation verified. Weights and</tspan><tspan x="675" dy="20.25">industrial data: not verified public. No code license was</tspan><tspan x="675" dy="20.25">located on the opened repository page; do not assume reuse…</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">Source: https://arxiv.org/abs/2509.18133 · Local nanoRSI reproduction: not run</text>
