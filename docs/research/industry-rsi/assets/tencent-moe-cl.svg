<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">Beijing University of Posts and Telecommunications ·</tspan><tspan x="70" dy="20.8">Tencent AI Lab</tspan></text>
