<text x="675" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">EVIDENCE LIMIT</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">For Qwen-2.5-7B Instruct, external sycophancy evaluation falls</tspan><tspan x="70" dy="22.95">from 68.0% to 42.0%; MMLU-Pro changes from 52.9% to 52.4%</tspan><tspan x="70" dy="22.95">(report Table 1). Lower sycophancy is better.</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">Three targeted failures; weaker Llama results expose forgetting.</tspan><tspan x="675" dy="22.95">The log description includes OOD feedback, so do not equate</tspan><tspan x="675" dy="22.95">every reported OOD split with an untouched final test.</tspan></text>
<text x="675" y="530" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">OPEN MATERIALS / LICENSE</text>
