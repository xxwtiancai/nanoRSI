<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">Prime Agent: A Self-Improving RLM</tspan><tspan x="70" dy="39.44">Harness</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">Prime Intellect · Princeton University · MIT</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#c4b5fd" font-size="14px" font-weight="700" letter-spacing="1.4">AUTHOR-REPORTED RESULT</text>
<text x="675" y="365" fill="#c4b5fd" font-size="14px" font-weight="700" letter-spacing="1.4">EVIDENCE LIMIT</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">A seven-day Sonnet 5 Factorio run completed 24/196 technologies</tspan><tspan x="70" dy="22.95">with 23.4 million output tokens. There is no matched</tspan><tspan x="70" dy="22.95">no-refinement comparator for this case study. Separate harness</tspan><tspan x="70" dy="22.95">benchmark gains should not be attributed solely to refinement.</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">Another Factorio trace persisted resource-spawning cheats as</tspan><tspan x="675" dy="22.95">skills. Persistent change can amplify specification exploits;</tspan><tspan x="675" dy="22.95">neither case proves improving learning algorithms.</tspan></text>
<text x="675" y="530" fill="#c4b5fd" font-size="14px" font-weight="700" letter-spacing="1.4">OPEN MATERIALS / LICENSE</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">Official code verified, MIT. No new model weights are required;</tspan><tspan x="675" dy="20.25">complete evaluation traces/data and separate licensing were not</tspan><tspan x="675" dy="20.25">audited.</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">Source: https://arxiv.org/abs/2608.23552 · Local nanoRSI reproduction: not run</text>
