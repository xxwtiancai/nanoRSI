<rect x="70" y="98" width="300" height="34" rx="17" fill="#9ef01a" opacity=".18"/><text x="88" y="121" fill="#9ef01a" font-size="16px" font-weight="700">Parameters and training data</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">Direct bounded loop · 2026-07-15</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">GPT-Red: Automated Red Teaming via</tspan><tspan x="70" dy="39.44">Self-Play at Scale</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">OpenAI</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">AUTHOR-REPORTED RESULT</text>
<text x="675" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">EVIDENCE LIMIT</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">The report gives 0.05% GPT-Red direct-injection success against</tspan><tspan x="70" dy="22.95">GPT-5.6 Sol, averaged over attempts on held-out environments.</tspan><tspan x="70" dy="22.95">This is one threat model, not a universal attack-failure</tspan><tspan x="70" dy="22.95">probability.</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">Bounded adversarial co-training; no autonomous successor-design</tspan><tspan x="675" dy="22.95">proof. Internal models and training scale prevent direct local</tspan><tspan x="675" dy="22.95">replication.</tspan></text>
<text x="675" y="530" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">OPEN MATERIALS / LICENSE</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">Paper public; GPT-Red internal-only. Training code, weights and</tspan><tspan x="675" dy="20.25">full data are not released in these sources; no reusable code</tspan><tspan x="675" dy="20.25">license established.</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">Source: https://cdn.openai.com/pdf/gpt-red-automated-red-teaming-via-self-play-at-scale.pdf · Local nanoRSI reproduction: not run</text>
