<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">Across nine single evolution trajectories, visible and held-out</tspan><tspan x="70" dy="22.95">score directions agree on 34/64 adjacent version switches</tspan><tspan x="70" dy="22.95">(53.1%); only 2/9 declared final versions are held-out best.</tspan><tspan x="70" dy="22.95">Creation covers six creators, four domains and 2,207 downstream…</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">A benchmark of bounded direct loops, not proof of stable</tspan><tspan x="675" dy="22.95">compounding. Selected final artifacts can regress, and gains</tspan><tspan x="675" dy="22.95">depend on the executor.</tspan></text>
