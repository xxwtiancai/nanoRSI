<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">ShinkaEvolve: Towards Open-Ended And Sample-Efficient Program Evolution</title>
<desc id="desc">Industry RSI evidence card for Sakana AI, 2025-09-17.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#16213b"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="619" rx="22" fill="none" stroke="#2b3a58"/>
<circle cx="1085" cy="100" r="56" fill="#6ee7f9" opacity=".13"/><circle cx="1085" cy="100" r="25" fill="#6ee7f9" opacity=".35"/>
<text x="70" y="78" fill="#6ee7f9" font-size="18px" font-weight="700" letter-spacing="2">NANORSI · 企业 RSI 证据</text>
<rect x="70" y="98" width="300" height="34" rx="17" fill="#6ee7f9" opacity=".18"/><text x="88" y="121" fill="#6ee7f9" font-size="16px" font-weight="700">Agent 与代码</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">直接有界闭环 · 2025-09-17</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">ShinkaEvolve: Towards Open-Ended And</tspan><tspan x="70" dy="39.44">Sample-Efficient Program Evolution</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">Sakana AI</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#6ee7f9" font-size="14px" font-weight="700" letter-spacing="1.4">作者报告结果</text>
<text x="675" y="365" fill="#6ee7f9" font-size="14px" font-weight="700" letter-spacing="1.4">证据边界</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">作者报告以 150 个样本找到优于 AlphaEvolve 的 26 圆装填解。MoE 损失搜索使用 30 代；公告称相对</tspan><tspan x="70" dy="22.95">Global LBL，无效路由减少 5.81%，七个基准的平均表现提高 1.73%。</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">目标由人类限定，并依赖外部 LLM；并未证明变异引擎自身持续改进或无界递归自我改进。</tspan></text>
<text x="675" y="530" fill="#6ee7f9" font-size="14px" font-weight="700" letter-spacing="1.4">开放材料 / 许可</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">已确认官方代码与示例，许可为 Apache-2.0；不要求发布新的基础模型权重。未完整审计实验数据开放情况。</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">来源：https://arxiv.org/abs/2509.19349 · nanoRSI 本地复现：未运行</text>
</svg>
