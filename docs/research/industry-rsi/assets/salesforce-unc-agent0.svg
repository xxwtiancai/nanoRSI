<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Agent0: Unleashing Self-Evolving Agents from Zero Data via Tool-Integrated Reasoning</title>
<desc id="desc">Industry RSI evidence card for UNC-Chapel Hill / Salesforce Research / Stanford University, 2025-11-20.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#16213b"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="619" rx="22" fill="none" stroke="#2b3a58"/>
<circle cx="1085" cy="100" r="56" fill="#9ef01a" opacity=".13"/><circle cx="1085" cy="100" r="25" fill="#9ef01a" opacity=".35"/>
<text x="70" y="78" fill="#9ef01a" font-size="18px" font-weight="700" letter-spacing="2">NANORSI · INDUSTRY RSI EVIDENCE</text>
<rect x="70" y="98" width="300" height="34" rx="17" fill="#9ef01a" opacity=".18"/><text x="88" y="121" fill="#9ef01a" font-size="16px" font-weight="700">Parameters and training data</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">Direct bounded loop · 2025-11-20</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">Agent0: Unleashing Self-Evolving</tspan><tspan x="70" dy="39.44">Agents from Zero Data via</tspan><tspan x="70" dy="39.44">Tool-Integrated Reasoning</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">UNC-Chapel Hill · Salesforce Research · Stanford</tspan><tspan x="70" dy="20.8">University</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">AUTHOR-REPORTED RESULT</text>
<text x="675" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">EVIDENCE LIMIT</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">Qwen3-8B math average rises 49.2→58.2 (+9.0 points; about 18%</tspan><tspan x="70" dy="22.95">relative), versus tool-only 53.2. Seven math benchmarks use</tspan><tspan x="70" dy="22.95">greedy pass@1 except AMC/AIME mean@32; Table 1 reports peak</tspan><tspan x="70" dy="22.95">training performance.</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">Zero data means no human-curated training set, not no pretrained</tspan><tspan x="675" dy="22.95">knowledge. Self-consistency can reinforce errors; results do not</tspan><tspan x="675" dy="22.95">establish unbounded improvement.</tspan></text>
<text x="675" y="530" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">OPEN MATERIALS / LICENSE</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">Official curriculum/executor training code verified; Apache-2.0.</tspan><tspan x="675" dy="20.25">Released trained weights and complete generated datasets not</tspan><tspan x="675" dy="20.25">verified.</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">Source: https://arxiv.org/abs/2511.16043 · Local nanoRSI reproduction: not run</text>
