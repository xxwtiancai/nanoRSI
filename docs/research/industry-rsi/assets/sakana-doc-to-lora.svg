<circle cx="1085" cy="100" r="56" fill="#9ef01a" opacity=".13"/><circle cx="1085" cy="100" r="25" fill="#9ef01a" opacity=".35"/>
<text x="70" y="78" fill="#9ef01a" font-size="18px" font-weight="700" letter-spacing="2">NANORSI · INDUSTRY RSI EVIDENCE</text>
<rect x="70" y="98" width="300" height="34" rx="17" fill="#9ef01a" opacity=".18"/><text x="88" y="121" fill="#9ef01a" font-size="16px" font-weight="700">Parameters and training data</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">Enabling technique / evaluation · 2026-02-13</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">Doc-to-LoRA: Learning to Instantly</tspan><tspan x="70" dy="39.44">Internalize Contexts</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">Sakana AI · Minerva University</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">AUTHOR-REPORTED RESULT</text>
<text x="675" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">EVIDENCE LIMIT</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">On 2WikiMultihopQA, iterative D2L reports 0.844 normalized</tspan><tspan x="70" dy="22.95">ROUGE-L, 3.791 GB additional update memory and 0.551 s latency.</tspan><tspan x="70" dy="22.95">Oracle context distillation reports 0.901, 7.820 GB and 40.171</tspan><tspan x="70" dy="22.95">s; normalized performance is relative to contextual inference.</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">An amortized adaptation mechanism, not a recursive loop:</tspan><tspan x="675" dy="22.95">deployment does not improve the hypernetwork. Accuracy and</tspan><tspan x="675" dy="22.95">adapter capacity remain constraints.</tspan></text>
<text x="675" y="530" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">OPEN MATERIALS / LICENSE</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">Official code: MIT. Hugging Face checkpoint files verified;</tspan><tspan x="675" dy="20.25">model-card license absent. Data-generation/evaluation scripts</tspan><tspan x="675" dy="20.25">exist; complete dataset redistribution not audited.</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">Source: https://arxiv.org/abs/2602.15902 · Local nanoRSI reproduction: not run</text>
