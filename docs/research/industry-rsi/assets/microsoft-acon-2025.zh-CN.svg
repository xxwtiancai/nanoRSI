<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">ACON: Optimizing Context Compression for Long-horizon LLM Agents</title>
<desc id="desc">Industry RSI evidence card for Microsoft / KAIST / University of Cambridge, 2025-10-01.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#16213b"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="619" rx="22" fill="none" stroke="#2b3a58"/>
<circle cx="1085" cy="100" r="56" fill="#c4b5fd" opacity=".13"/><circle cx="1085" cy="100" r="25" fill="#c4b5fd" opacity=".35"/>
<text x="70" y="78" fill="#c4b5fd" font-size="18px" font-weight="700" letter-spacing="2">NANORSI · 企业 RSI 证据</text>
<rect x="70" y="98" width="300" height="34" rx="17" fill="#c4b5fd" opacity=".18"/><text x="88" y="121" fill="#c4b5fd" font-size="16px" font-weight="700">记忆与上下文</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">直接有界闭环 · 2025-10-01</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">ACON: Optimizing Context Compression</tspan><tspan x="70" dy="39.44">for Long-horizon LLM Agents</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">Microsoft · KAIST · University of Cambridge</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#c4b5fd" font-size="14px" font-weight="700" letter-spacing="1.4">作者报告结果</text>
<text x="675" y="365" fill="#c4b5fd" font-size="14px" font-weight="700" letter-spacing="1.4">证据边界</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">OfficeBench采用GPT-4.1作为智能体和压缩器：效用优化的历史压缩取得74.74%准确率和4.93k峰值令牌；无压缩</tspan><tspan x="70" dy="22.95">为76.84%/7.27k，简单提示压缩为71.58%/4.40k（v1表2）。</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">属于有限的离线模块优化；准确率与令牌开销的取舍不等于普遍提高准确率，也不是优化器重写自身。</tspan></text>
<text x="675" y="530" fill="#c4b5fd" font-size="14px" font-weight="700" letter-spacing="1.4">开放材料 / 许可</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">已确认官方代码、MIT许可及蒸馏流程；未确认公开蒸馏权重、专用数据集及其许可；外部基准和模型适用各自条款。</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">来源：https://arxiv.org/abs/2510.00615 · nanoRSI 本地复现：未运行</text>
</svg>
