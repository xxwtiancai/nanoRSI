<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">DeepSeekMath-V2: Towards Self-Verifiable Mathematical Reasoning</title>
<desc id="desc">Industry RSI evidence card for DeepSeek-AI, 2025-11-27.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#16213b"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="619" rx="22" fill="none" stroke="#2b3a58"/>
<circle cx="1085" cy="100" r="56" fill="#9ef01a" opacity=".13"/><circle cx="1085" cy="100" r="25" fill="#9ef01a" opacity=".35"/>
<text x="70" y="78" fill="#9ef01a" font-size="18px" font-weight="700" letter-spacing="2">NANORSI · INDUSTRY RSI EVIDENCE</text>
<rect x="70" y="98" width="300" height="34" rx="17" fill="#9ef01a" opacity=".18"/><text x="88" y="121" fill="#9ef01a" font-size="16px" font-weight="700">Parameters and training data</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">Direct bounded loop · 2025-11-27</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">DeepSeekMath-V2: Towards</tspan><tspan x="70" dy="39.44">Self-Verifiable Mathematical Reasoning</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">DeepSeek-AI</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">AUTHOR-REPORTED RESULT</text>
<text x="675" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">EVIDENCE LIMIT</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">Authors report 118/120 on Putnam 2024 after expert assessment.</tspan><tspan x="70" dy="22.95">High-compute search starts with 64 proofs and 64 analyses each,</tspan><tspan x="70" dy="22.95">selects 64 top proofs, samples 8 analyses per proof, and runs up</tspan><tspan x="70" dy="22.95">to 16 refinement iterations. This is not one-shot performance.</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">Natural-language verification is fallible and uses expert</tspan><tspan x="675" dy="22.95">bootstrap supervision. Proof-search success alone is not</tspan><tspan x="675" dy="22.95">recursive improvement of the model.</tspan></text>
<text x="675" y="530" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">OPEN MATERIALS / LICENSE</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">Public inference code, prompts/predictions, and 685B weights;</tspan><tspan x="675" dy="20.25">repository and weights are Apache-2.0. Full training code, human</tspan><tspan x="675" dy="20.25">annotations and complete training data were not verified as…</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">Source: https://arxiv.org/abs/2511.22570 · Local nanoRSI reproduction: not run</text>
</svg>
