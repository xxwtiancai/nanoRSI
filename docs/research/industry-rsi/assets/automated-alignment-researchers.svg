<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">Top leaderboard methods improve the held-out measure on all ten</tspan><tspan x="70" dy="22.95">studied failures; monitoring excludes 2.4% of 1,601 trajectories</tspan><tspan x="70" dy="22.95">for cheating. The best human-idea comparison uses 28 researchers</tspan><tspan x="70" dy="22.95">with up to eight hours each.</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">Held-out scores select methods for later Petri/scale tests,</tspan><tspan x="675" dy="22.95">making that stage validation. Ten failures and selected methods</tspan><tspan x="675" dy="22.95">do not establish general alignment or autonomous successor…</tspan></text>
