<title id="title">LEGOMem: Modular Procedural Memory for Multi-agent LLM Systems for Workflow Automation</title>
<desc id="desc">Industry RSI evidence card for Microsoft, 2025-10-06.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#16213b"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="619" rx="22" fill="none" stroke="#2b3a58"/>
<circle cx="1085" cy="100" r="56" fill="#c4b5fd" opacity=".13"/><circle cx="1085" cy="100" r="25" fill="#c4b5fd" opacity=".35"/>
<text x="70" y="78" fill="#c4b5fd" font-size="18px" font-weight="700" letter-spacing="2">NANORSI · INDUSTRY RSI EVIDENCE</text>
<rect x="70" y="98" width="300" height="34" rx="17" fill="#c4b5fd" opacity=".18"/><text x="88" y="121" fill="#c4b5fd" font-size="16px" font-weight="700">Memory and context</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">Enabling technique / evaluation · 2025-10-06</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">LEGOMem: Modular Procedural Memory for</tspan><tspan x="70" dy="39.44">Multi-agent LLM Systems for Workflow</tspan><tspan x="70" dy="39.44">Automation</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">Microsoft</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#c4b5fd" font-size="14px" font-weight="700" letter-spacing="1.4">AUTHOR-REPORTED RESULT</text>
<text x="675" y="365" fill="#c4b5fd" font-size="14px" font-weight="700" letter-spacing="1.4">EVIDENCE LIMIT</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">OfficeBench, 148 training/152 test tasks, three seeds: GPT-4o</tspan><tspan x="70" dy="22.95">success 58.44% versus 45.83% without memory; GPT-4o-mini 38.16%</tspan><tspan x="70" dy="22.95">versus 24.78%. Synapse scores 58.11% with GPT-4o, so the</tspan><tspan x="70" dy="22.95">strong-baseline margin there is small.</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">Supports procedure-memory reuse, not demonstrated repeated</tspan><tspan x="675" dy="22.95">recursive self-improvement; curated memory and external model</tspan><tspan x="675" dy="22.95">dependence matter.</tspan></text>
<text x="675" y="530" fill="#c4b5fd" font-size="14px" font-weight="700" letter-spacing="1.4">OPEN MATERIALS / LICENSE</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">Paper verified. Dedicated official code, weights, memory-bank</tspan><tspan x="675" dy="20.25">data and corresponding licences were not identified in opened</tspan><tspan x="675" dy="20.25">sources or targeted search; availability remains unverified.</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">Source: https://arxiv.org/abs/2510.04851 · Local nanoRSI reproduction: not run</text>
