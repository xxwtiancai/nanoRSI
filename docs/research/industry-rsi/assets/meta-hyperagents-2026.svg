<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">Hyperagents</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">Meta · University of British Columbia</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#6ee7f9" font-size="14px" font-weight="700" letter-spacing="1.4">AUTHOR-REPORTED RESULT</text>
<text x="675" y="365" fill="#6ee7f9" font-size="14px" font-weight="700" letter-spacing="1.4">EVIDENCE LIMIT</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">After 100 iterations, held-out paper-review accuracy was 0.710</tspan><tspan x="70" dy="22.95">(CI 0.590–0.750), versus static baseline 0.630 and customized</tspan><tspan x="70" dy="22.95">DGM 0.590. The customized-DGM difference was not significant;</tspan><tspan x="70" dy="22.95">initial 0.0 reflected output-format failure.</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">Fixed foundation models/evaluators and bounded runs do not</tspan><tspan x="675" dy="22.95">demonstrate indefinite self-acceleration.</tspan></text>
<text x="675" y="530" fill="#6ee7f9" font-size="14px" font-weight="700" letter-spacing="1.4">OPEN MATERIALS / LICENSE</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">Official code and linked experiment logs verified;</tspan><tspan x="675" dy="20.25">foundation-model weights are not supplied. Code licence is CC</tspan><tspan x="675" dy="20.25">BY-NC-SA 4.0, not permissive commercial open source. Linked log…</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">Source: https://arxiv.org/abs/2603.19461 · Local nanoRSI reproduction: not run</text>
