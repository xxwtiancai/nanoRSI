<text x="70" y="365" fill="#fbbf24" font-size="14px" font-weight="700" letter-spacing="1.4">AUTHOR-REPORTED RESULT</text>
<text x="675" y="365" fill="#fbbf24" font-size="14px" font-weight="700" letter-spacing="1.4">EVIDENCE LIMIT</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">Report: 153 runs, 18 models, 8×H200 per run. Current Fable 5</tspan><tspan x="70" dy="22.95">best is 2,726 steps versus the verified 3,290 baseline to train</tspan><tspan x="70" dy="22.95">a 124M GPT toward loss 3.28; acceptance requires eight-run mean</tspan><tspan x="70" dy="22.95">below 3.27859.</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">Live table grows; best-seed selection and unequal durations</tspan><tspan x="675" dy="22.95">complicate comparisons. Authors report no fundamentally new</tspan><tspan x="675" dy="22.95">methods and question transfer to large-scale training.</tspan></text>
<text x="675" y="530" fill="#fbbf24" font-size="14px" font-weight="700" letter-spacing="1.4">OPEN MATERIALS / LICENSE</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">Official repository and report-linked traces verified.</tspan><tspan x="675" dy="20.25">Repository license not detected; complete raw-data availability</tspan><tspan x="675" dy="20.25">not audited. No newly released agent weights.</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">Source: https://www.primeintellect.ai/blog/measuring-autonomous-research · Local nanoRSI reproduction: not run</text>
