<text x="70" y="78" fill="#6ee7f9" font-size="18px" font-weight="700" letter-spacing="2">NANORSI · INDUSTRY RSI EVIDENCE</text>
<rect x="70" y="98" width="300" height="34" rx="17" fill="#6ee7f9" opacity=".18"/><text x="88" y="121" fill="#6ee7f9" font-size="16px" font-weight="700">Agents and code</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">Direct bounded loop · 2025-09-17</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">ShinkaEvolve: Towards Open-Ended And</tspan><tspan x="70" dy="39.44">Sample-Efficient Program Evolution</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">Sakana AI</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#6ee7f9" font-size="14px" font-weight="700" letter-spacing="1.4">AUTHOR-REPORTED RESULT</text>
<text x="675" y="365" fill="#6ee7f9" font-size="14px" font-weight="700" letter-spacing="1.4">EVIDENCE LIMIT</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">Authors report a 26-circle packing solution exceeding</tspan><tspan x="70" dy="22.95">AlphaEvolve&#x27;s solution after 150 samples. MoE loss search used</tspan><tspan x="70" dy="22.95">30 generations; versus Global LBL, the announcement reports</tspan><tspan x="70" dy="22.95">5.81% less inefficient routing and 1.73% higher average…</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">Bounded, human-defined objectives and external LLMs; this does</tspan><tspan x="675" dy="22.95">not demonstrate an autonomously improving mutation engine or</tspan><tspan x="675" dy="22.95">unlimited RSI.</tspan></text>
<text x="675" y="530" fill="#6ee7f9" font-size="14px" font-weight="700" letter-spacing="1.4">OPEN MATERIALS / LICENSE</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">Official code/examples: verified; Apache-2.0. No new foundation</tspan><tspan x="675" dy="20.25">weights required. Complete experimental data availability was</tspan><tspan x="675" dy="20.25">not audited.</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">Source: https://arxiv.org/abs/2509.19349 · Local nanoRSI reproduction: not run</text>
