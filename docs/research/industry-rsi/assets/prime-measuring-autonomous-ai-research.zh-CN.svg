<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Measuring Autonomous AI Research</title>
<desc id="desc">Industry RSI evidence card for Prime Intellect, 2026-08-14.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#16213b"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="619" rx="22" fill="none" stroke="#2b3a58"/>
<circle cx="1085" cy="100" r="56" fill="#fbbf24" opacity=".13"/><circle cx="1085" cy="100" r="25" fill="#fbbf24" opacity=".35"/>
<text x="70" y="78" fill="#fbbf24" font-size="18px" font-weight="700" letter-spacing="2">NANORSI · 企业 RSI 证据</text>
<rect x="70" y="98" width="300" height="34" rx="17" fill="#fbbf24" opacity=".18"/><text x="88" y="121" fill="#fbbf24" font-size="16px" font-weight="700">自动化研发与评测</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">自动化／辅助研发 · 2026-08-14</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">Measuring Autonomous AI Research</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">Prime Intellect</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#fbbf24" font-size="14px" font-weight="700" letter-spacing="1.4">作者报告结果</text>
<text x="675" y="365" fill="#fbbf24" font-size="14px" font-weight="700" letter-spacing="1.4">证据边界</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">报告称进行了 153 次运行、覆盖 18 个模型，每次使用 8 张 H200。当前 Fable 5 最佳为 2,726</tspan><tspan x="70" dy="22.95">步，验证后的基线为 3,290 步，目标是使 124M GPT 损失达到 3.28；正式接受要求八次运行的均值低于</tspan><tspan x="70" dy="22.95">3.27859。</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">动态表仍在增长；最优种子筛选及不同时长影响可比性。作者称未产生根本新方法，并质疑结果向大规模训练的迁移。</tspan></text>
<text x="675" y="530" fill="#fbbf24" font-size="14px" font-weight="700" letter-spacing="1.4">开放材料 / 许可</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">已确认官方仓库及报告链接的轨迹；未发现仓库许可，未完整审计原始数据可用性，无新发布的研究智能体权重。</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">来源：https://www.primeintellect.ai/blog/measuring-autonomous-research · nanoRSI 本地复现：未运行</text>
</svg>
