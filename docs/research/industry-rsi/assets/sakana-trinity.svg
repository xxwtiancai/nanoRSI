<title id="title">TRINITY: An Evolved LLM Coordinator</title>
<desc id="desc">Industry RSI evidence card for Sakana AI / Institute of Science Tokyo / University of Michigan, 2025-12-04.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#16213b"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="619" rx="22" fill="none" stroke="#2b3a58"/>
<circle cx="1085" cy="100" r="56" fill="#9ef01a" opacity=".13"/><circle cx="1085" cy="100" r="25" fill="#9ef01a" opacity=".35"/>
<text x="70" y="78" fill="#9ef01a" font-size="18px" font-weight="700" letter-spacing="2">NANORSI · INDUSTRY RSI EVIDENCE</text>
<rect x="70" y="98" width="300" height="34" rx="17" fill="#9ef01a" opacity=".18"/><text x="88" y="121" fill="#9ef01a" font-size="16px" font-weight="700">Parameters and training data</text>
<text x="395" y="121" fill="#a8b5ca" font-size="16px">Enabling technique / evaluation · 2025-12-04</text>
<text x="70" y="150" fill="#f8fafc" font-size="34px" font-weight="700"><tspan x="70" dy="0">TRINITY: An Evolved LLM Coordinator</tspan></text>
<text x="70" y="285" fill="#b6c2d9" font-size="16px" font-weight="400"><tspan x="70" dy="0">Sakana AI · Institute of Science Tokyo · University</tspan><tspan x="70" dy="20.8">of Michigan</tspan></text>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#2b3a58"/>
<text x="70" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">AUTHOR-REPORTED RESULT</text>
<text x="675" y="365" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">EVIDENCE LIMIT</text>
<text x="70" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="70" dy="0">LiveCodeBench v6: 86.2% pass@1 versus GPT-5 83.8%, using</tspan><tspan x="70" dy="22.95">uncapped outputs and no coordinator retraining. Under the</tspan><tspan x="70" dy="22.95">separate 4,096-token, five-turn comparison, TRINITY scores 61%;</tspan><tspan x="70" dy="22.95">do not conflate these settings.</tspan></text>
<text x="675" y="400" fill="#edf2f7" font-size="17px" font-weight="400"><tspan x="675" dy="0">An offline optimizer learns coordination on human-selected</tspan><tspan x="675" dy="22.95">benchmarks; the deployed agent is not shown modifying its own</tspan><tspan x="675" dy="22.95">learning algorithm.</tspan></text>
<text x="675" y="530" fill="#9ef01a" font-size="14px" font-weight="700" letter-spacing="1.4">OPEN MATERIALS / LICENSE</text>
<text x="675" y="555" fill="#cbd5e1" font-size="15px" font-weight="400"><tspan x="675" dy="0">Paper public. Official implementation, coordinator weights,</tspan><tspan x="675" dy="20.25">redistributed data and their licenses not verified; third-party</tspan><tspan x="675" dy="20.25">implementations are not official releases.</tspan></text>
<text x="70" y="612" fill="#7f8da6" font-size="13px">Source: https://arxiv.org/abs/2512.04695 · Local nanoRSI reproduction: not run</text>
